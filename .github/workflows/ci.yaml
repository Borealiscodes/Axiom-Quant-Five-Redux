name: Redux CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Prepare local package
        run: |
          echo "Using local Project.toml"
          cat Project.toml
          julia --project=. -e '
            import Pkg;
            Pkg.activate(".");
            Pkg.develop(path=".");
            Pkg.instantiate();
            Pkg.status();
          '

      - name: Run tests (manual)
        run: |
          julia --project=. -e '
            import Pkg;
            Pkg.activate(".");
            Pkg.test();
          '
